name: Build Release PCL

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read full application version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assemblyInfo = Get-Content 'Plain Craft Launcher 2\My Project\AssemblyInfo.vb' -Raw
          $match = [regex]::Match($assemblyInfo, 'AssemblyFileVersion\("([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)"\)')
          if (-not $match.Success) { throw 'Could not find a four-part AssemblyFileVersion.' }
          "value=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          "PCL_VERSION=$($match.Groups[1].Value)" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Update help archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $help = Join-Path $env:RUNNER_TEMP 'PCL2Help'
          git clone --depth 1 --branch master https://github.com/LTCatt/PCL2Help.git $help
          Compress-Archive -Path (Join-Path $help '*') -DestinationPath (Join-Path $help 'Help.zip') -Force
          Copy-Item (Join-Path $help 'Help.zip') 'Plain Craft Launcher 2/Resources/Help.zip' -Force

      - name: Restore packages
        run: dotnet restore PCLCS\PCLCS.csproj

      - name: Build Release
        run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release -p:Platform=AnyCPU

      - name: Prepare release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item 'Plain Craft Launcher 2\bin\Plain Craft Launcher 2.exe' "dist\Plain Craft Launcher rebuild $env:PCL_VERSION.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plain Craft Launcher rebuild ${{ steps.version.outputs.value }}
          path: dist\Plain Craft Launcher rebuild ${{ steps.version.outputs.value }}.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download release asset
        uses: actions/download-artifact@v4
        with:
          name: Plain Craft Launcher rebuild ${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          asset_name="Plain-Craft-Launcher-rebuild-${VERSION}.exe"
          asset="dist/${asset_name}"
          cp "dist/Plain Craft Launcher rebuild ${VERSION}.exe" "$asset"
          release_json=$(jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg name "Plain Craft Launcher rebuild ${VERSION}" \
            '{tag_name: $tag, target_commitish: env.GITHUB_SHA, name: $name, body: "首次自动构建测试版本。此 Release 由 GitHub Actions 自动构建并发布，用于验证构建流程。请参阅仓库 README。", draft: false, prerelease: false}')
          release=$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          if [[ $(jq -r '.id // empty' <<< "$release") ]]; then
            release_id=$(jq -r '.id' <<< "$release")
            curl --fail-with-body -sS \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi
          release=$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "$release_json")
          upload_url=$(jq -r '.upload_url' <<< "$release" | sed 's/{?name,label}//')
          if [[ -z "$upload_url" || "$upload_url" == "null" ]]; then
            echo "$release" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          actual_name=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.name == "'"${asset_name}"'") | .name')
          if [[ "$actual_name" != "$asset_name" ]]; then
            echo "Expected release asset '$asset_name', got '$actual_name'" >&2
            exit 1
          fi
