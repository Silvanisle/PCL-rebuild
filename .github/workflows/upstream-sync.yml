name: Upstream Sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Manual or scheduled runs only: upstream pushes do not trigger workflows
  # in this repository automatically.

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout customization branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Detect latest upstream release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/Meloong-Git/PCL/releases?per_page=30" \
            --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | last | "\(.tag_name)\t\(.published_at)"')
          tag=$(printf '%s' "$release" | cut -f1)
          published=$(printf '%s' "$release" | cut -f2)
          if [ -z "${tag}" ]; then
            echo "::error::Could not resolve a published release from Meloong-Git/PCL."
            exit 1
          fi
          echo "Latest upstream release: ${tag} (published ${published})"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          git remote add upstream https://github.com/Meloong-Git/PCL.git
          git fetch upstream --tags --force
          target=$(git rev-list -n1 "refs/tags/${tag}")
          echo "Release commit: ${target}"
          if git merge-base --is-ancestor "${target}" HEAD; then
            echo "Release ${tag} is already included in main."
            echo "UPSTREAM_CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "Release ${tag} is new; merging it."
            echo "UPSTREAM_CHANGED=true" >> "$GITHUB_ENV"
            echo "UPSTREAM_TARGET=${target}" >> "$GITHUB_ENV"
          fi

      - name: Merge upstream release
        if: env.UPSTREAM_CHANGED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit --no-ff "${UPSTREAM_TARGET}"

      - name: Remove upstream official build archive
        if: env.UPSTREAM_CHANGED == 'true'
        shell: bash
        run: rm -f -- '最新正式版.zip'

      - name: Re-enable Minecraft download in source
        if: env.UPSTREAM_CHANGED == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Plain Craft Launcher 2/Modules/ModSecret.vb')
          text = path.read_text(encoding='utf-8-sig')
          old = 'Public Const RestrictMcDownload As Boolean = True'
          new = 'Public Const RestrictMcDownload As Boolean = False'
          count = text.count(old)
          if count == 0:
              if new in text:
                  print("Already patched: RestrictMcDownload is already False.")
                  raise SystemExit(0)
              raise SystemExit(f'Restriction constant not found; refusing to patch.')
          if count != 1:
              raise SystemExit(f'Expected exactly one restriction constant, found {count}; refusing to patch.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8-sig', newline='')
          print("Patched RestrictMcDownload to False.")
          PY

      - name: Update startup notice for modified build
        if: env.UPSTREAM_CHANGED == 'true'
        run: python3 .github/scripts/patch_modified_notice.py

      - name: Commit and push synchronized source
        if: env.UPSTREAM_CHANGED == 'true'
        run: |
          if git diff --quiet; then
            echo "No upstream or patch changes to commit."
            exit 0
          fi
          git add "Plain Craft Launcher 2/Modules/ModSecret.vb"
          git add -u
          git commit -m "Sync upstream release ${{ steps.release.outputs.tag }} and enable Minecraft downloads"
          git push origin HEAD:main

      - name: Create release tag and dispatch release build
        if: env.UPSTREAM_CHANGED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('Plain Craft Launcher 2/My Project/AssemblyInfo.vb').read_text(encoding='utf-8-sig')
          match = re.search(r'AssemblyFileVersion\("([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)"\)', text)
          if not match:
              raise SystemExit('Could not find a four-part AssemblyFileVersion.')
          print(match.group(1))
          PY
          )
          tag="v${version}"
          sha=$(git rev-parse --short=7 HEAD)
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            tag="${tag}-build.${sha}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; skipping release dispatch."
            exit 0
          fi
          git tag -a "$tag" -m "Plain Craft Launcher rebuild ${version}"
          git push origin "$tag"
          gh workflow run --repo "${GITHUB_REPOSITORY}" release.yml --ref main --field "release_tag=${tag}"