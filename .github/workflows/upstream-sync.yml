name: Upstream Sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Manual or scheduled runs only: upstream pushes do not trigger workflows
  # in this repository automatically.

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout customization branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Fetch upstream and merge
        run: |
          git remote add upstream https://github.com/Meloong-Git/PCL.git
          git fetch upstream main --tags
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream is already synchronized."
            echo "UPSTREAM_CHANGED=false" >> "$GITHUB_ENV"
          else
            git merge --no-edit --no-ff upstream/main
            echo "UPSTREAM_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Re-enable Minecraft download in source
        if: env.UPSTREAM_CHANGED == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Plain Craft Launcher 2/Modules/ModSecret.vb')
          text = path.read_text(encoding='utf-8-sig')
          old = 'Public Const RestrictMcDownload As Boolean = True'
          new = 'Public Const RestrictMcDownload As Boolean = False'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one restriction constant, found {count}; refusing to patch.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8-sig', newline='')
          PY

      - name: Commit and push synchronized source
        if: env.UPSTREAM_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No upstream or patch changes to commit."
            exit 0
          fi
          git add "Plain Craft Launcher 2/Modules/ModSecret.vb"
          git add -u
          git commit -m "Sync upstream and enable Minecraft downloads"
          git push origin HEAD:main

      - name: Create release tag and dispatch release build
        if: env.UPSTREAM_CHANGED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('Plain Craft Launcher 2/My Project/AssemblyInfo.vb').read_text(encoding='utf-8-sig')
          match = re.search(r'AssemblyFileVersion\("([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)"\)', text)
          if not match:
              raise SystemExit('Could not find a four-part AssemblyFileVersion.')
          print(match.group(1))
          PY
          )
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            tag="${tag}-build.${GITHUB_SHA:0:7}"
          fi
          git tag -a "$tag" -m "Plain Craft Launcher rebuild ${version}"
          git push origin "$tag"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -d "$(jq -n --arg ref main --arg tag "$tag" '{ref: $ref, inputs: {release_tag: $tag}}')"
